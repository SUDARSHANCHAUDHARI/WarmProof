name: check

# Everything that can be verified without an API key or a credential. The plugin's own suite runs
# against a mocked engine, so it needs no account; the two scripts are self-checking.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the manifest and the hooks module
        run: claude plugin validate .

      - name: Run the suite
        run: claude plugin test .

      - name: Every spend goes through a logged wrapper
        run: python3 -I scripts/check-evidence.py

      - name: The status-line segment parses as data
        run: python3 -I scripts/statusline-segment.py --self-test
